server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
spring:
  application:
    name: weiguang
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:weiguang}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  # AI 网关（详设 §5.1）：Key 取 env DASHSCOPE_API_KEY；护栏：必须关闭思考模式
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          enable-thinking: false
  # 图片上传：上限 25MB，使 storage.image_max_size_mb（1-20）的业务校验（10002）先于容器限制生效
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator：仅暴露 health/info/metrics，敏感端点显式排除
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
        exclude: env,configprops,beans,heapdump,threaddump,loggers,shutdown
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.weiguang: info
