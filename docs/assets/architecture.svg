<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #000000; }
    .box { fill: none; stroke: #000000; stroke-width: 1.3; }
    .box-dash { fill: none; stroke: #000000; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .line { fill: none; stroke: #000000; stroke-width: 1.3; }
    .t-title { font-size: 28px; font-weight: 700; }
    .t-sub { font-size: 14px; }
    .t-sec { font-size: 12.5px; letter-spacing: 2px; }
    .t-box { font-size: 16.5px; font-weight: 600; }
    .t-box2 { font-size: 15.5px; font-weight: 600; }
    .t-small { font-size: 11.5px; }
    .t-note { font-size: 12.5px; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="40" y="46" class="t-title">微光 · 社区互助服务系统架构</text>
  <text x="40" y="72" class="t-sub">面向社区老年居民与热心邻居的邻里互助小程序</text>

  <!-- 客户端 -->
  <text x="40" y="112" class="t-sec">客户端</text>
  <rect x="40" y="124" width="360" height="62" rx="6" class="box"/>
  <text x="220" y="152" text-anchor="middle" class="t-box">微信小程序 · uni-app + Vue3</text>
  <text x="220" y="172" text-anchor="middle" class="t-small">31 个页面 · 年长 / 普通双模式</text>

  <rect x="420" y="124" width="360" height="62" rx="6" class="box"/>
  <text x="600" y="152" text-anchor="middle" class="t-box">管理后台 · Vue3 + Element Plus</text>
  <text x="600" y="172" text-anchor="middle" class="t-small">工作台 · 审核 · 上报处置 · 仲裁</text>

  <rect x="800" y="124" width="360" height="62" rx="6" class="box"/>
  <text x="980" y="152" text-anchor="middle" class="t-box">AI 小助手（小程序内）</text>
  <text x="980" y="172" text-anchor="middle" class="t-small">问答 · 槽位补齐 · 确认后发布</text>

  <!-- 连接线 -->
  <line x1="220" y1="206" x2="980" y2="206" class="line"/>
  <line x1="600" y1="206" x2="600" y2="236" class="line" marker-end="url(#arrow)"/>

  <!-- 服务端 -->
  <text x="40" y="250" class="t-sec">服务端 · SPRING BOOT 3.5 / JAVA 17（模块化单体）</text>
  <rect x="40" y="262" width="1120" height="54" rx="6" class="box"/>
  <text x="600" y="294" text-anchor="middle" class="t-box2">接入层：JWT 鉴权 · AOP + Redis 限流 · 统一异常与结果 · 事务提交后 WebSocket 推送</text>

  <line x1="600" y1="316" x2="600" y2="340" class="line" marker-end="url(#arrow)"/>

  <!-- 业务模块 -->
  <rect x="40" y="346" width="170" height="64" rx="6" class="box"/>
  <text x="125" y="372" text-anchor="middle" class="t-box2">认证与用户</text>
  <text x="125" y="391" text-anchor="middle" class="t-small">账密登录 · BCrypt</text>

  <rect x="230" y="346" width="170" height="64" rx="6" class="box"/>
  <text x="315" y="372" text-anchor="middle" class="t-box2">求助与订单</text>
  <text x="315" y="391" text-anchor="middle" class="t-small">状态机 · 双确认 · 结算</text>

  <rect x="420" y="346" width="170" height="64" rx="6" class="box"/>
  <text x="505" y="372" text-anchor="middle" class="t-box2">聊天与消息</text>
  <text x="505" y="391" text-anchor="middle" class="t-small">WebSocket · 通知聚合</text>

  <rect x="610" y="346" width="170" height="64" rx="6" class="box"/>
  <text x="695" y="372" text-anchor="middle" class="t-box2">社区与内容</text>
  <text x="695" y="391" text-anchor="middle" class="t-small">敏感词 · AI · 人工</text>

  <rect x="800" y="346" width="170" height="64" rx="6" class="box"/>
  <text x="885" y="372" text-anchor="middle" class="t-box2">申诉与处置</text>
  <text x="885" y="391" text-anchor="middle" class="t-small">仲裁 · 超时兜底</text>

  <rect x="990" y="346" width="170" height="64" rx="6" class="box"/>
  <text x="1075" y="372" text-anchor="middle" class="t-box2">管理端接口</text>
  <text x="1075" y="391" text-anchor="middle" class="t-small">工作台 · 裁决 · 配置</text>

  <line x1="600" y1="410" x2="600" y2="436" class="line" marker-end="url(#arrow)"/>

  <!-- AI 能力层 -->
  <rect x="40" y="442" width="1120" height="66" rx="6" class="box-dash"/>
  <text x="600" y="468" text-anchor="middle" class="t-box2">AI 能力层 · Spring AI Alibaba（通义千问）</text>
  <text x="600" y="490" text-anchor="middle" class="t-small">发布槽位补齐 / 内容分级审核 / 防诈异步复核 / 感谢信草稿　｜　密钥只存后端 · 5 类字段脱敏 · 异常降级到规则</text>

  <line x1="600" y1="508" x2="600" y2="534" class="line" marker-end="url(#arrow)"/>

  <!-- 基础设施 -->
  <text x="40" y="552" class="t-sec">基础设施</text>
  <rect x="40" y="560" width="206" height="84" rx="6" class="box"/>
  <text x="143" y="586" text-anchor="middle" class="t-box">MySQL 8.4</text>
  <text x="143" y="604" text-anchor="middle" class="t-small">26 张表 · 唯一键幂等</text>
  <text x="143" y="620" text-anchor="middle" class="t-small">FOR UPDATE 结算</text>

  <rect x="266" y="560" width="206" height="84" rx="6" class="box"/>
  <text x="369" y="586" text-anchor="middle" class="t-box">Redis 7.4</text>
  <text x="369" y="604" text-anchor="middle" class="t-small">限流 · 会话 · GETDEL</text>
  <text x="369" y="620" text-anchor="middle" class="t-small">缓存 · 降级可用</text>

  <rect x="492" y="560" width="206" height="84" rx="6" class="box"/>
  <text x="595" y="586" text-anchor="middle" class="t-box">DashScope</text>
  <text x="595" y="604" text-anchor="middle" class="t-small">通义千问 · mock / real</text>
  <text x="595" y="620" text-anchor="middle" class="t-small">超时重试 · 规则兜底</text>

  <rect x="718" y="560" width="206" height="84" rx="6" class="box"/>
  <text x="821" y="586" text-anchor="middle" class="t-box">高德 Web 服务</text>
  <text x="821" y="604" text-anchor="middle" class="t-small">POI · 输入提示 · 地理编码</text>
  <text x="821" y="620" text-anchor="middle" class="t-small">失败降级手动填写</text>

  <rect x="944" y="560" width="206" height="84" rx="6" class="box"/>
  <text x="1047" y="586" text-anchor="middle" class="t-box">本地文件存储</text>
  <text x="1047" y="604" text-anchor="middle" class="t-small">头像 · 聊天图片 · 凭证</text>
  <text x="1047" y="620" text-anchor="middle" class="t-small">上传魔数校验</text>

  <text x="40" y="674" class="t-note">部署：Docker Compose 一键起（MySQL + Redis + 后端）　｜　7 个 Testcontainers 集成测试类　｜　24 条数据不变量自检</text>
</svg>


